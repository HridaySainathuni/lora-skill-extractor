[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-skill-extractor"
version = "0.1.0"
description = "LoRA fine-tune of a small open model to extract structured skills and requirements from job postings."
requires-python = ">=3.12"
dependencies = [
    "torch==2.9.1",
    "transformers==4.57.6",
    "peft==0.17.1",
    "accelerate==1.10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
